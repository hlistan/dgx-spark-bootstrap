# Spark monitoring — hardware, OS and inference (docs/decisions.md S2).
#
# The community pattern for DGX Spark: Prometheus scrapes node_exporter (OS), nvidia_gpu_exporter (GB10, nvidia-smi
# backed — DCGM can't enumerate GB10 reliably and reports no memory on unified memory), cAdvisor (containers),
# vLLM's own /metrics (inference) and blackbox_exporter (endpoint health); Grafana renders the community DGX Spark
# dashboard + Node Exporter Full.
#
# Every service runs on the host network so exporters can bind to 127.0.0.1 — nothing but Grafana is reachable
# from the LAN, and Grafana binds only to SPARK_BIND_IP behind its login and host/spark-firewall.sh.
# Memory caps matter: on GB10 every byte here comes out of the 128 GB pool vLLM is sized against.

name: spark-monitoring

x-common: &common
  restart: unless-stopped
  network_mode: host
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  prometheus:
    <<: *common
    image: prom/prometheus:v3.15.1
    container_name: spark-prometheus
    mem_limit: 1g
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-20GB}
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle            # loopback only: `make monitoring-reload`
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *common
    image: grafana/grafana:13.3.0
    container_name: spark-grafana
    mem_limit: 768m  # 512m was OOM-killed ~13×/day (Grafana 13.2, 2026-11-17)
    environment:
      GF_SERVER_HTTP_ADDR: ${SPARK_BIND_IP:?set SPARK_BIND_IP}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_METRICS_ENABLED: "false"         # /metrics would be unauthenticated on the LAN
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/spark-health.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1
    container_name: spark-node-exporter
    mem_limit: 128m
    pid: host
    # DGX OS's docker-default AppArmor profile blocks D-Bus, which the systemd collector needs (unit states drive
    # SparkSystemdUnitFailed). The container stays read-only on the host filesystem.
    security_opt: ["apparmor=unconfined"]
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      # GB10's cppc_cpufreq driver stalls root reads of cpuinfo_cur_freq for >10 s on some scrapes, which failed
      # every 2nd-3rd scrape (bisected 2026-11-02). GPU clocks come from gpu-exporter instead.
      - --no-collector.cpufreq
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|var/lib/docker|snap)($$|/)
      - --collector.systemd
      # Results of the periodic analysis and benchmark (analysis/, S8) as metrics, so Prometheus can alert on them.
      # Mounted on its own: the exporter runs as nobody and can't traverse the user's home (750) through /host.
      - --collector.textfile.directory=/textfile
      - --collector.systemd.unit-include=(docker|containerd|nvidia-.*|dgx-.*|spark-firewall|ssh|smartmontools|rasdaemon|systemd-timesyncd)\.service
    volumes:
      - /:/host:ro,rslave
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - ${SPARK_REPORTS_DIR:-${HOME}/spark-reports}/metrics:/textfile:ro

  gpu-exporter:
    <<: *common
    # utkuozdemir/nvidia_gpu_exporter: wraps nvidia-smi --query-gpu, so it exposes every field GB10 reports
    # (temp + T.Limit, power, clocks, clock-event/throttle counters). The community Spark dashboard is built on it.
    image: utkuozdemir/nvidia_gpu_exporter:1.15.1
    container_name: spark-gpu-exporter
    mem_limit: 128m
    command: ["--web.listen-address=127.0.0.1:9835"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  cadvisor:
    <<: *common
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: spark-cadvisor
    mem_limit: 256m
    privileged: true
    devices: [/dev/kmsg]
    command:
      - --listen_ip=127.0.0.1
      - --port=8088
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  blackbox:
    <<: *common
    image: prom/blackbox-exporter:v0.29.1
    container_name: spark-blackbox
    mem_limit: 64m
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox:/etc/blackbox:ro

volumes:
  prometheus-data:
  grafana-data:
