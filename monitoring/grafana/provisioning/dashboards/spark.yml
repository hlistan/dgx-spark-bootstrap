apiVersion: 1
providers:
  - name: DGX Spark
    folder: DGX Spark
    type: file
    disableDeletion: true
    allowUiUpdates: false      # the repo copy is authoritative: vendored ones via grafana/vendor-dashboards.py,
                               # spark-health.json by editing the JSON
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
