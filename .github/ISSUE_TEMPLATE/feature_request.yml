name: Improvement
description: Propose a change to the setup, a new check or a documentation fix
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong today, and how you noticed. Measurements help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would change. Name the decision in docs/decisions.md (S1 to S8) it touches, if any.
    validations:
      required: true
