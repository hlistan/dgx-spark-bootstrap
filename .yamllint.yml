# yamllint for `make lint` (S7). Compose and Prometheus files carry long explanatory comments: 120 columns.
extends: default
ignore: |
  inference/voices/
rules:
  line-length: { max: 120, level: error }
  document-start: disable
  comments: { min-spaces-from-content: 1 }
  comments-indentation: disable
  truthy: { check-keys: false }
  braces: { max-spaces-inside: 1 }
  brackets: { max-spaces-inside: 1 }
