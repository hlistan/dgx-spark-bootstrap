# Unit tests for the alert rules (`make lint` runs `promtool test rules`, S7).
rule_files: [../rules/spark.yml]
evaluation_interval: 1m

tests:
  - name: bench regression fires only after a sustained drop below the 14-day median
    interval: 5m             # the real series is scraped every 15 s; > 5 m gaps would go stale
    input_series:
      - series: 'spark_bench_decode_tokens_per_second{case="decode"}'
        values: '36x575 25x36'  # 48 h at 36 tok/s, then 3 h at 25
    alert_rule_test:
      - eval_time: 48h30m
        alertname: SparkBenchRegression
        exp_alerts: []
      - eval_time: 50h
        alertname: SparkBenchRegression
        exp_alerts:
          - exp_labels: { severity: warning, case: decode }
            exp_annotations:
              summary: "Benchmark decode: decode 25.0 tok/s, >15% below 14-day median"

  - name: stale analysis
    interval: 5m
    input_series:
      - series: 'spark_analysis_last_run_timestamp_seconds{window="24h"}'
        values: '0x400'         # last analysis at t=0, never again
      - series: 'spark_bench_last_run_timestamp_seconds'
        values: '0+300x400'     # benchmark keeps running'
    alert_rule_test:
      - eval_time: 25h
        alertname: SparkAnalysisStale
        exp_alerts: []
      - eval_time: 28h
        alertname: SparkAnalysisStale
        exp_alerts:
          - exp_labels: { severity: warning, window: 24h }
            exp_annotations:
              summary: "Periodic analysis/benchmark hasn't run for over 26 h — check `make schedule`"

  - name: llm restart is reported, other containers are not
    interval: 1m
    input_series:
      - series: 'container_start_time_seconds{name="spark-llm"}'
        values: '100x5 400x5'
      - series: 'container_start_time_seconds{name="spark-grafana"}'
        values: '100x5 400x5'
    alert_rule_test:
      - eval_time: 8m
        alertname: InferenceContainerRestarted
        exp_alerts:
          - exp_labels: { severity: warning, name: spark-llm }
            exp_annotations:
              summary: "Container spark-llm restarted in the last 15 min"

  - name: low unified memory
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: '20e9x5 4e9x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: SparkUnifiedMemoryLow
        exp_alerts: []
      - eval_time: 12m
        alertname: SparkUnifiedMemoryLow
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Only 3.725GiB unified memory available — vLLM risks OOM"

  - name: gpu telemetry lost while the exporter is up (faulted GB10, 'GPU requires reset')
    interval: 1m
    input_series:
      - series: 'up{job="gpu", instance="127.0.0.1:9835"}'
        values: '1x60'
      - series: 'nvidia_smi_temperature_gpu_tlimit{job="gpu", instance="127.0.0.1:9835"}'
        values: '58x10 _x50'    # series disappears at 10m
    alert_rule_test:
      - eval_time: 20m
        alertname: SparkGpuTelemetryLost
        exp_alerts: []
      - eval_time: 40m
        alertname: SparkGpuTelemetryLost
        exp_alerts:
          - exp_labels: { severity: critical, job: gpu, instance: "127.0.0.1:9835" }
            exp_annotations:
              summary: "GB10 telemetry incomplete: GPU likely needs a reset (Xid in kernel log) — reboot"
